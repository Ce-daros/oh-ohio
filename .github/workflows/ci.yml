name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate:content
      # Build must precede test: the HTTP suite serves the built dist/ tree.
      - run: npm run build
      - run: npm test
      # Internal-link check over the built site; remote links are covered
      # by check:remote-media.
      - run: npm run check:links
